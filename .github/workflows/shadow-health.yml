name: NRE Shadow asset health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/workflows/shadow-health.yml'
  pull_request:
    paths:
      - 'ops/**'
      - '.github/workflows/shadow-health.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: nre-shadow-health
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ops/*.test.mjs

  health:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public sites and workflows; manage incident issue
        run: node ops/shadow-health.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
