name: NRE Discord Event Operator

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview planned actions without contacting Discord'
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'ops/nre-events.mjs'
      - 'ops/nre-events.test.mjs'
      - 'ops/events.json'
      - 'ops/event-program.json'
      - 'ops/nre-event-program.mjs'
      - 'ops/nre-event-program.test.mjs'
      - 'ops/nre-servers.mjs'
      - 'ops/nre-servers.test.mjs'
      - 'ops/server-targets.json'
      - '.github/workflows/nre-events.yml'
  pull_request:
    paths:
      - 'ops/nre-events.mjs'
      - 'ops/nre-events.test.mjs'
      - 'ops/events.json'
      - 'ops/event-program.json'
      - 'ops/nre-event-program.mjs'
      - 'ops/nre-event-program.test.mjs'
      - 'ops/nre-servers.mjs'
      - 'ops/nre-servers.test.mjs'
      - 'ops/server-targets.json'
      - '.github/workflows/nre-events.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: nre-discord-event-operator
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ops/nre-events.test.mjs ops/nre-event-program.test.mjs ops/nre-servers.test.mjs

  deliver:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create approved Discord events and send due reminders
        run: node ops/nre-events.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NRE_DISCORD_BOT_TOKEN: ${{ secrets.NRE_DISCORD_BOT_TOKEN }}
          NRE_DISCORD_GUILD_ID: ${{ vars.NRE_DISCORD_GUILD_ID }}
          NRE_DISCORD_ANNOUNCEMENT_CHANNEL_ID: ${{ vars.NRE_DISCORD_ANNOUNCEMENT_CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
